<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% seo %}
<meta name="google-site-verification" content="pqpEue8R41CT7IKQLTzj6MYNwpnDI1nWXekqcVPfzjM" />

  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "NordVault Security",
    "url": "{{ site.url }}",
    "description": "{{ site.description }}",
    "founder": { "@type": "Person", "name": "Amritesh", "url": "{{ site.founder.url }}" },
    "areaServed": ["US", "GB", "DE", "NL", "SE", "NO", "DK", "FI"],
    "knowsAbout": ["GRC", "Cybersecurity", "Data Protection", "AI Security", "GDPR"]
  }
  </script>
</head>
<body>
  {% include nav.html %}
  <main>{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
